<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bookMyShow.css">
</head>
<body>
    <header>
        <div class="head">

            <div class="logo">
                <div class="left"><h1>BookMyShow</h1></div>
                <div class="right">
                    <button>Movies</button>
                    <button>Events</button>
                    <button>Sports</button>
                    <button>More</button>
                </div>
            </div>
            
            <div class="search">
                <input type="text" placeholder="Search for movies, events or sports" class="searching">
                <button>Search</button>
            </div>

        </div>
    </header>

    <main>
        <div class="rect"> 
            <h2>Experience the best Movies and Events</h2>
            <button>Book Now</button>
        </div>

        <div class="popular"><h2>Popular Movies</h2></div>

        <div class="movie">
            <!-- <h2>Recommended Movies</h2> -->
            
            <div class="card">
                <img src="./images/img1.avif" alt="" class="images">
                <h3>Bhool Bhulaiya 3</h3>
            </div>
            
            <div class="card">
                <img src="./images/img2.avif" alt="" class="images">
                <h3>Venom The Last Dance</h3>
            </div>

            <div class="card">
                <img src="./images/img3.avif" alt="" class="images">
                <h3>Singham Returns</h3>
            </div>

            <div class="card">
                <img src="./images/img4.avif" alt="" class="images">
                <h3>Inspector</h3>
            </div>

            <div class="card">
                <img src="./images/img5.avif" alt="" class="images">
                <h3>Tekka</h3>
            </div>

            <div class="card">
                <img src="./images/img6.avif" alt="" class="images">
                <h3>The Great Escaper</h3>
            </div>

            <div class="card">
                <img src="./images/img7.avif" alt="" class="images">
                <h3>The Line</h3>
            </div>

            <div class="card">
                <img src="./images/img8.jpg" alt="" class="images">
                <h3>Yolo</h3>
            </div>

            <div class="card">
                <img src="./images/img9.jpg" alt="" class="images">
                <h3>Judwaa 2</h3>
            </div>

            <div class="card">
                <img src="./images/img10.jpg" alt="" class="images">
                <h3>Udankhatola</h3>
            </div>

        </div>

    </main>

    <div class="bot">
        <img src="./images/bottom.avif" alt="">
    </div>
</body>
</html>
